name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: dist matches the source
        run: |
          pnpm build
          git diff --exit-code dist

  action:
    # Needs a test cache: the variable SNOWSTEAD_TEST_CACHE and the secret
    # SNOWSTEAD_AUTH_TOKEN, a push token for it.
    if: vars.SNOWSTEAD_TEST_CACHE != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: ./
        with:
          name: ${{ vars.SNOWSTEAD_TEST_CACHE }}
          authToken: ${{ secrets.SNOWSTEAD_AUTH_TOKEN }}
      - name: build a path of the job's own
        run: |
          mkdir -p out
          echo "${{ github.run_id }}-${{ github.run_attempt }}" > out/run
          nix store add --name snowstead-action-test out
